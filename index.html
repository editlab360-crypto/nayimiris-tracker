<script>
(function () {
  const DK = { npk: 'dateNpk', fungicide: 'dateFungicide', hormone: 'dateHormone' };
  const KEY_OF = { dateNpk: 'npk', dateFungicide: 'fungicide', dateHormone: 'hormone' };
  const TX = {
    si: {
      prodLabel: 'භාවිතා කළ වෙළඳ නාමය / පොහොර නම:', 
      prodPh: 'උදා: Mancozeb, Abamectin, NPK 15-15-15',
      priceLabel: 'විකුණූ මිල (1 kg එකකට රුපියල්):', 
      pricePh: 'උදා: 450',
      logTitle: 'යෙදුම් ඉතිහාසය (පොහොර / පළිබෝධ නාශක / දිලීර නාශක)', 
      logTag: 'යෙදූ යෙදුම් සටහන',
      thType: 'වර්ගය', 
      thName: 'වෙළඳ නාමය (Brand Name)', 
      thPrice: 'රු./kg', 
      thValue: 'වටිනාකම (රු.)',
      kpiRev: 'මුළු ආදායම', 
      kpiRevSub: 'සාමාන්‍ය මිල: රු. ', 
      emptyLog: 'තවම යෙදුම් සටහන් කර නොමැත',
      npk: 'NPK පොහොර', 
      fungicide: 'දිලීර / පළිබෝධ නාශක', 
      hormone: 'හෝමෝන', 
      sessions: 'අස්වනු වාර',
      invalid: 'කරුණාකර වලංගු දිනයක් සහ බරක් (kg > 0) ඇතුළත් කරන්න.', 
      fresh: 'නෙළන ලද නැවුම් අස්වැන්න'
    },
    en: {
      prodLabel: 'Brand Name / Fertilizer Used:', 
      prodPh: 'e.g. Mancozeb, Abamectin, NPK 15-15-15',
      priceLabel: 'Selling Price (Rs. per kg):', 
      pricePh: 'e.g. 450',
      logTitle: 'Application History (Fertilizers / Fungicides / Pesticides)', 
      logTag: 'Product Log',
      thType: 'Type', 
      thName: 'Brand Name', 
      thPrice: 'Rs./kg', 
      thValue: 'Value (Rs.)',
      kpiRev: 'Total Revenue', 
      kpiRevSub: 'Avg price: Rs. ', 
      emptyLog: 'No applications logged yet',
      npk: 'NPK Fertilizer', 
      fungicide: 'Fungicide / Pesticide', 
      hormone: 'Hormone', 
      sessions: 'Sessions',
      invalid: 'Please enter a valid date and weight (kg > 0).', 
      fresh: 'Fresh picking'
    }
  };

  const x = k => TX[currentLang] ? TX[currentLang][k] : TX['si'][k];
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = n => Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  
  function ensure() {
    if (!farmData.products) farmData.products = { npk: '', fungicide: '', hormone: '' };
    if (!farmData.applog) farmData.applog = [];
  }

  /* ---------- 1. Product-name inputs on the 3 cards ---------- */
  Object.keys(DK).forEach(key => {
    const cardId = { npk: 'cardNpk', fungicide: 'cardFungicide', hormone: 'cardHormone' }[key];
    const cardEl = document.getElementById(cardId);
    if (!cardEl) return;
    
    const box = cardEl.querySelector('.schedule-inputs') || cardEl;
    const g = document.createElement('div');
    g.className = 'form-group';
    g.innerHTML = '<label id="lblProd_' + key + '" for="prod_' + key + '"></label>' +
      '<input type="text" id="prod_' + key + '" list="dl_' + key + '" autocomplete="off">' +
      '<datalist id="dl_' + key + '"></datalist>';
    box.insertBefore(g, box.firstChild);
    
    g.querySelector('input').addEventListener('input', e => {
      ensure();
      const name = e.target.value;
      farmData.products[key] = name;
      const d = farmData[DK[key]];
      if (d) {
        const en = farmData.applog.find(a => a.type === key && a.date === d);
        if (en) en.name = name.trim();
        else if (name.trim()) farmData.applog.push({ id: Date.now() + key, type: key, date: d, name: name.trim() });
      }
      saveData();
      renderLog();
    });
  });

  /* ---------- 2. Application history panel ---------- */
  const logPanel = document.createElement('section');
  logPanel.className = 'panel';
  logPanel.style.gridColumn = 'span 12';
  logPanel.innerHTML =
    '<div class="panel-header"><h2><span>📒</span> <span id="xLogTitle"></span></h2><span class="badge-tag" id="xLogTag"></span></div>' +
    '<div class="harvest-table-wrap"><table class="harvest-table"><thead><tr>' +
    '<th id="xThDate"></th><th id="xThType"></th><th id="xThName"></th><th style="text-align:right">&nbsp;</th>' +
    '</tr></thead><tbody id="xLogBody"></tbody></table></div>';
  
  const schedulesPanel = document.querySelector('.panel-schedules');
  if (schedulesPanel) {
    schedulesPanel.insertAdjacentElement('afterend', logPanel);
  }

  window.delLog = function (id) {
    ensure();
    farmData.applog = farmData.applog.filter(a => a.id !== id);
    saveData();
    renderLog();
  };

  function renderLog() {
    ensure();
    const body = document.getElementById('xLogBody');
    if (!body) return;
    
    const log = [...farmData.applog].sort((a, b) => b.date.localeCompare(a.date));
    body.innerHTML = log.length ? '' : '<tr><td colspan="4" style="text-align:center;color:var(--text-muted);padding:1.5rem">' + x('emptyLog') + '</td></tr>';
    
    log.forEach(a => {
      const tr = document.createElement('tr');
      tr.innerHTML = '<td style="font-weight:600">' + (typeof formatDateDisplay === 'function' ? formatDateDisplay(a.date) : a.date) + '</td>' +
        '<td>' + x(a.type) + '</td>' +
        '<td><span class="weight-badge">' + (esc(a.name) || '—') + '</span></td>' +
        '<td style="text-align:right"><button class="btn-delete" onclick="delLog(\'' + a.id + '\')">🗑</button></td>';
      body.appendChild(tr);
    });
    
    Object.keys(DK).forEach(key => {
      const dl = document.getElementById('dl_' + key);
      if (dl) {
        const names = [...new Set(farmData.applog.filter(a => a.type === key && a.name).map(a => a.name))];
        dl.innerHTML = names.map(n => '<option value="' + esc(n) + '">').join('');
      }
    });
  }

  /* ---------- 3. Harvest form: price field ---------- */
  const harvestKg = document.getElementById('harvestKg');
  if (harvestKg) {
    const kgGroup = harvestKg.closest('.form-group');
    if (kgGroup) {
      kgGroup.insertAdjacentHTML('afterend',
        '<div class="form-group"><label for="harvestPrice" id="xLblPrice"></label>' +
        '<input type="number" id="harvestPrice" step="0.01" min="0"></div>');
    }
  }

  /* ---------- 4. Revenue KPI card ---------- */
  const kpiRow = document.querySelector('.kpi-row');
  if (kpiRow) {
    kpiRow.insertAdjacentHTML('beforeend',
      '<div class="kpi-card"><div class="kpi-info"><p class="label" id="xKpiRevLbl"></p>' +
      '<h3 id="xKpiRev">රු. 0.00</h3><p class="subtext" id="xKpiRevSub"></p></div>' +
      '<div class="kpi-icon-wrap kpi-icon-amber">💰</div></div>');
  }

  /* ---------- 5. Harvest table header with price + value ---------- */
  const harvestThead = document.querySelector('#harvestTable thead');
  if (harvestThead) {
    harvestThead.innerHTML =
      '<tr><th>#</th><th id="thDate"></th><th id="thWeight"></th><th id="xThPrice"></th><th id="xThValue"></th>' +
      '<th id="thNotes"></th><th style="text-align:right" id="thAction"></th></tr>';
  }

  /* ---------- Overrides ---------- */
  if (typeof handleFieldChange !== 'undefined') {
    const origFC = handleFieldChange;
    handleFieldChange = function (id, v) {
      const type = KEY_OF[id];
      if (type && v) {
        ensure();
        const nm = (farmData.products[type] || '').trim();
        const en = farmData.applog.find(a => a.type === type && a.date === v);
        if (en) { if (nm) en.name = nm; }
        else farmData.applog.push({ id: Date.now() + type, type: type, date: v, name: nm });
      }
      origFC(id, v);
    };
  }

  if (typeof handleHarvestSubmit !== 'undefined') {
    handleHarvestSubmit = function (event) {
      event.preventDefault();
      const dateVal = document.getElementById('harvestDate').value;
      const kgVal = parseFloat(document.getElementById('harvestKg').value);
      const priceVal = document.getElementById('harvestPrice');
      const price = priceVal ? parseFloat(priceVal.value) : 0;
      const notesVal = document.getElementById('harvestNotes');
      const notes = notesVal ? notesVal.value.trim() : '';

      if (!dateVal || isNaN(kgVal) || kgVal <= 0) { alert(x('invalid')); return; }

      farmData.harvests.unshift({
        id: Date.now().toString(), date: dateVal, kg: kgVal,
        price: isNaN(price) ? 0 : price, notes: notes || x('fresh')
      });
      
      saveData();
      document.getElementById('harvestKg').value = '';
      if (priceVal) priceVal.value = '';
      if (notesVal) notesVal.value = '';
      if (typeof setDateFieldToday === 'function') setDateFieldToday('harvestDate');
      renderHarvests();
    };
  }

  if (typeof renderHarvests !== 'undefined') {
    renderHarvests = function () {
      const tb = document.getElementById('harvestTableBody');
      const empty = document.getElementById('harvestEmptyState');
      const H = farmData.harvests || [];
      if (!tb) return;
      
      tb.innerHTML = '';
      let tk = 0, tv = 0, pricedKg = 0;
      const sorted = [...H].sort((a, b) => new Date(b.date) - new Date(a.date));
      
      sorted.forEach((it, i) => {
        const kg = Number(it.kg), p = Number(it.price) || 0;
        tk += kg; tv += kg * p; if (p) pricedKg += kg;
        
        const tr = document.createElement('tr');
        tr.innerHTML =
          '<td style="color:var(--text-muted);font-size:.78rem">' + (sorted.length - i) + '</td>' +
          '<td style="font-weight:600">' + (typeof formatDateDisplay === 'function' ? formatDateDisplay(it.date) : it.date) + '</td>' +
          '<td><span class="weight-badge">' + kg.toFixed(2) + ' kg</span></td>' +
          '<td>' + (p ? 'රු. ' + fmt(p) : '-') + '</td>' +
          '<td style="font-weight:700;color:#2e7d32">' + (p ? 'රු. ' + fmt(kg * p) : '-') + '</td>' +
          '<td style="color:var(--text-muted)">' + (esc(it.notes) || '-') + '</td>' +
          '<td style="text-align:right"><button class="btn-delete" onclick="deleteHarvest(\'' + it.id + '\')">🗑</button></td>';
        tb.appendChild(tr);
      });
      
      if (empty) empty.style.display = H.length ? 'none' : 'block';
      
      const sessionEl = document.getElementById('tableSessionCount');
      if (sessionEl) sessionEl.textContent = H.length;
      
      const kpiYield = document.getElementById('kpiTotalYield');
      if (kpiYield) {
        kpiYield.innerHTML = tk.toFixed(2) +
          ' <span style="font-size:1rem;font-weight:normal;color:var(--text-muted)">kg</span>';
      }
      
      const kpiCount = document.getElementById('kpiHarvestCount');
      if (kpiCount) {
        kpiCount.textContent = H.length
          ? H.length + ' ' + x('sessions') + ' (Avg ' + (tk / H.length).toFixed(1) + ' kg)' 
          : (typeof t === 'function' ? t('kpiHarvestCountEmpty') : '0 Sessions');
      }

      const revEl = document.getElementById('xKpiRev');
      if (revEl) revEl.innerHTML = 'රු. ' + fmt(tv);
      
      const revSubEl = document.getElementById('xKpiRevSub');
      if (revSubEl) revSubEl.textContent = pricedKg ? x('kpiRevSub') + fmt(tv / pricedKg) + ' / kg' : '—';
    };
  }

  if (typeof syncInputsFromState !== 'undefined') {
    const origSync = syncInputsFromState;
    syncInputsFromState = function () {
      ensure();
      origSync();
      Object.keys(DK).forEach(k => {
        const inp = document.getElementById('prod_' + k);
        if (inp) inp.value = farmData.products[k] || '';
      });
    };
  }

  if (typeof renderAll !== 'undefined') {
    const origRenderAll = renderAll;
    renderAll = function () { origRenderAll(); renderLog(); };
  }

  if (typeof updateLanguageUI !== 'undefined') {
    const origUL = updateLanguageUI;
    updateLanguageUI = function () {
      origUL();
      Object.keys(DK).forEach(k => {
        const lbl = document.getElementById('lblProd_' + k);
        const inp = document.getElementById('prod_' + k);
        if (lbl) lbl.textContent = x('prodLabel');
        if (inp) inp.placeholder = x('prodPh');
      });
      
      const lblPrice = document.getElementById('xLblPrice');
      const hPrice = document.getElementById('harvestPrice');
      if (lblPrice) lblPrice.textContent = x('priceLabel');
      if (hPrice) hPrice.placeholder = x('pricePh');
      
      const logTitle = document.getElementById('xLogTitle');
      const logTag = document.getElementById('xLogTag');
      if (logTitle) logTitle.textContent = x('logTitle');
      if (logTag) logTag.textContent = x('logTag');
      
      const thDate = document.getElementById('xThDate');
      const thType = document.getElementById('xThType');
      const thName = document.getElementById('xThName');
      const thPrice = document.getElementById('xThPrice');
      const thValue = document.getElementById('xThValue');
      if (thDate) thDate.textContent = typeof t === 'function' ? t('thDate') : 'දිනය';
      if (thType) thType.textContent = x('thType');
      if (thName) thName.textContent = x('thName');
      if (thPrice) thPrice.textContent = x('thPrice');
      if (thValue) thValue.textContent = x('thValue');
      
      const kpiRevLbl = document.getElementById('xKpiRevLbl');
      if (kpiRevLbl) kpiRevLbl.textContent = x('kpiRev');
    };
  }

  // Initial call
  setTimeout(() => {
    ensure();
    renderLog();
    if (typeof updateLanguageUI === 'function') updateLanguageUI();
  }, 300);
})();
</script>
