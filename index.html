<script>
    let harvestChart = null;
    let farmData = {
        plantingDate: '', lastFertilizer: '', lastFungicide: '', lastHormone: '',
        prodNpk: '', prodFungicide: '', prodHormone: '',
        weatherCity: 'monaragala',
        harvests: []
    };
    const CYCLE = { npk: 14, fungicide: 7, hormone: 10 };

    // වගා ස්ථාන සහ ඒවායේ අක්ෂාංශ / දේශාංශ
    const coords = {
        monaragala:   { lat: 6.8728, lon: 81.3507, name: 'මොනරාගල (Monaragala)' },
        colombo:      { lat: 6.9271, lon: 79.8612, name: 'කොළඹ (Colombo)' },
        gampaha:      { lat: 7.0840, lon: 80.0098, name: 'ගම්පහ (Gampaha)' },
        kandy:        { lat: 7.2906, lon: 80.6337, name: 'මහනුවර (Kandy)' },
        kurunegala:   { lat: 7.4863, lon: 80.3647, name: 'කුරුණෑගල (Kurunegala)' },
        anuradhapura: { lat: 8.3114, lon: 80.4037, name: 'අනුරාධපුරය (Anuradhapura)' },
        galle:        { lat: 6.0535, lon: 80.2210, name: 'ගාල්ල (Galle)' },
        jaffna:       { lat: 9.6615, lon: 80.0255, name: 'යාපනය (Jaffna)' }
    };

    const $ = id => document.getElementById(id);
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const money = n => 'රු. ' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    function todayStr() {
        const d = new Date();
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }
    // YYYY-MM-DD දිනයක සිට අද දක්වා දවස් ගණන (local වේලාවෙන්)
    function daysSince(s) {
        if (!s) return null;
        const [y, m, d] = s.split('-').map(Number);
        const t = new Date(); t.setHours(0, 0, 0, 0);
        return Math.round((t - new Date(y, m - 1, d)) / 86400000);
    }

    document.addEventListener('DOMContentLoaded', () => {
        // වගා ස්ථාන තෝරන කොටුව සකස් කිරීම
        const sel = $('weatherCitySelect');
        sel.innerHTML = Object.keys(coords).map(k => '<option value="' + k + '">' + coords[k].name + '</option>').join('');
        sel.value = 'monaragala';
        sel.onchange = () => { saveData(); fetchWeather(); };
        const lbl = document.querySelector('label[for="weatherCitySelect"]');
        if (lbl) lbl.textContent = 'වගා ස්ථානය තෝරන්න:';

        // නම් ටයිප් කරන විටම සුරැකීම
        ['prod_npk', 'prod_fungicide', 'prod_hormone'].forEach(id => $(id).addEventListener('input', updateAll));

        $('harvestDate').value = todayStr();
        loadData();
        updateAll();
        renderHarvests();
        fetchWeather();
    });

    function saveData() {
        farmData.plantingDate = $('plantingDate').value;
        farmData.lastFertilizer = $('lastFertilizer').value;
        farmData.lastFungicide = $('lastFungicide').value;
        farmData.lastHormone = $('lastHormone').value;
        farmData.prodNpk = $('prod_npk').value;
        farmData.prodFungicide = $('prod_fungicide').value;
        farmData.prodHormone = $('prod_hormone').value;
        farmData.weatherCity = $('weatherCitySelect').value;
        try { localStorage.setItem('naiMirisFarmData', JSON.stringify(farmData)); } catch (e) { console.error(e); }
    }

    function loadData() {
        try {
            const saved = localStorage.getItem('naiMirisFarmData');
            if (saved) farmData = Object.assign(farmData, JSON.parse(saved));
        } catch (e) { console.error(e); }
        if (!Array.isArray(farmData.harvests)) farmData.harvests = [];
        if (!coords[farmData.weatherCity]) farmData.weatherCity = 'monaragala';

        $('plantingDate').value = farmData.plantingDate || '';
        $('lastFertilizer').value = farmData.lastFertilizer || '';
        $('lastFungicide').value = farmData.lastFungicide || '';
        $('lastHormone').value = farmData.lastHormone || '';
        $('prod_npk').value = farmData.prodNpk || '';
        $('prod_fungicide').value = farmData.prodFungicide || '';
        $('prod_hormone').value = farmData.prodHormone || '';
        $('weatherCitySelect').value = farmData.weatherCity;
    }

    // මතක් කිරීම් ගොඩනැගීම: තව දවස් 2 / හෙට / අද / පමා
    function reminderFor(name, days, cycle) {
        const rem = cycle - days;
        if (rem < 0) return '<div class="reminder-box danger-reminder">🚨 <b>අවධානයයි:</b> ' + esc(name) + ' යෙදීම දවස් ' + (-rem) + 'ක් ප්‍රමාදයි! (චක්‍රය දින ' + cycle + ')</div>';
        if (rem === 0) return '<div class="reminder-box danger-reminder">🚨 <b>අද යෙදිය යුතුයි:</b> ' + esc(name) + ' (දින ' + cycle + 'ක චක්‍රය සම්පූර්ණයි)</div>';
        if (rem === 1) return '<div class="reminder-box">⚠️ <b>හෙට යෙදිය යුතුයි:</b> ' + esc(name) + '</div>';
        if (rem === 2) return '<div class="reminder-box">⚠️ <b>මතක් කිරීමයි:</b> ' + esc(name) + ' යෙදීමට තව දවස් 2යි.</div>';
        return '';
    }

    function updateAll() {
        saveData();

        const pDays = daysSince($('plantingDate').value);
        $('totalDays').innerText = pDays !== null ? Math.max(0, pDays) : 0;

        let statusText = '', remindersText = '';
        const items = [
            { date: $('lastFertilizer').value, name: $('prod_npk').value.trim() || 'NPK පොහොර', cycle: CYCLE.npk },
            { date: $('lastFungicide').value, name: $('prod_fungicide').value.trim() || 'දිලීර නාශක', cycle: CYCLE.fungicide },
            { date: $('lastHormone').value, name: $('prod_hormone').value.trim() || 'හෝමෝන', cycle: CYCLE.hormone }
        ];
        items.forEach(it => {
            const days = daysSince(it.date);
            if (days === null || days < 0) return;
            statusText += '• <b>' + esc(it.name) + '</b> යොදා දැනට <b>' + days + '</b> දවස් වී ඇත. (චක්‍රය දින ' + it.cycle + ')<br>';
            remindersText += reminderFor(it.name, days, it.cycle);
        });

        $('actionStatus').innerHTML = statusText || 'දිනයන් සහ භාවිත කළ ද්‍රව්‍ය ඇතුළත් කරන්න.';
        $('reminderContainer').innerHTML = remindersText || 'සක්‍රීය මතක් කිරීම් නොමැත.';
    }

    function addHarvest() {
        const hDate = $('harvestDate').value;
        const hAmount = parseFloat($('harvestAmount').value);
        const hPrice = parseFloat($('harvestPrice').value) || 0;
        const hNotes = $('harvestNotes').value.trim();

        if (!hDate || isNaN(hAmount) || hAmount <= 0) {
            alert('කරුණාකර නිවැරදි දිනයක් සහ බරක් (kg) ඇතුළත් කරන්න!');
            return;
        }
        farmData.harvests.push({ id: Date.now().toString(), date: hDate, amount: hAmount, price: hPrice, notes: hNotes });
        saveData();
        renderHarvests();
        $('harvestAmount').value = '';
        $('harvestPrice').value = '';
        $('harvestNotes').value = '';
    }

    function deleteHarvest(id) {
        farmData.harvests = farmData.harvests.filter(item => item.id !== id);
        saveData();
        renderHarvests();
    }

    function renderHarvests() {
        const tbody = $('harvestTableBody');
        tbody.innerHTML = '';
        let totalKg = 0, totalRev = 0;
        const sorted = [...farmData.harvests].sort((a, b) => new Date(b.date) - new Date(a.date));

        sorted.forEach(item => {
            const amount = Number(item.amount), price = Number(item.price) || 0;
            const val = amount * price;
            totalKg += amount; totalRev += val;
            const tr = document.createElement('tr');
            tr.innerHTML =
                '<td>' + esc(item.date) + '</td>' +
                '<td><b>' + amount.toFixed(2) + ' kg</b></td>' +
                '<td>' + (price ? money(price) : '-') + '</td>' +
                '<td style="color:#d97706;font-weight:bold;">' + (val ? money(val) : '-') + '</td>' +
                '<td>' + (esc(item.notes) || '-') + '</td>' +
                '<td style="text-align:right;"><button class="btn-delete" onclick="deleteHarvest(\'' + item.id + '\')">🗑</button></td>';
            tbody.appendChild(tr);
        });

        $('totalHarvestKg').innerText = totalKg.toFixed(2);
        $('totalRevenueRs').innerText = money(totalRev);
        updateAnalytics();
    }

    function updateAnalytics() {
        const H = farmData.harvests || [];
        const tbody = $('monthlySummaryBody');

        if (harvestChart) { harvestChart.destroy(); harvestChart = null; }
        if (!H.length) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">දත්ත නොමැත.</td></tr>';
            return;
        }
        const sorted = [...H].sort((a, b) => new Date(a.date) - new Date(b.date));

        // 1. ප්‍රස්ථාරය (Chart.js load වී ඇත්නම් පමණක්)
        const ctx = $('harvestTrendsChart');
        if (ctx && typeof Chart !== 'undefined') {
            harvestChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: sorted.map(i => i.date),
                    datasets: [
                        { type: 'line', label: '1 kg මිල (රු.)', data: sorted.map(i => Number(i.price) || 0), borderColor: '#ef4444', borderWidth: 3, yAxisID: 'yPrice' },
                        { type: 'bar', label: 'අස්වැන්න (kg)', data: sorted.map(i => Number(i.amount)), backgroundColor: 'rgba(46, 125, 50, 0.75)', yAxisID: 'yWeight' }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    scales: {
                        yWeight: { type: 'linear', position: 'left', beginAtZero: true },
                        yPrice: { type: 'linear', position: 'right', beginAtZero: true, grid: { drawOnChartArea: false } }
                    }
                }
            });
        }

        // 2. මාසික සාරාංශය
        const monthly = {};
        sorted.forEach(item => {
            const m = item.date.substring(0, 7);
            if (!monthly[m]) monthly[m] = { count: 0, kg: 0, val: 0 };
            monthly[m].count++;
            monthly[m].kg += Number(item.amount);
            monthly[m].val += Number(item.amount) * (Number(item.price) || 0);
        });
        tbody.innerHTML = '';
        Object.keys(monthly).sort().reverse().forEach(m => {
            const d = monthly[m];
            const avg = d.kg ? d.val / d.kg : 0;
            tbody.innerHTML +=
                '<tr><td><b>' + m + '</b></td><td>' + d.count + ' වාරයක්</td>' +
                '<td><b>' + d.kg.toFixed(2) + ' kg</b></td>' +
                '<td>' + (avg ? money(avg) : '-') + '</td>' +
                '<td style="text-align:right;font-weight:bold;color:#d97706;">' + (d.val ? money(d.val) : '-') + '</td></tr>';
        });
    }

    // කාලගුණය
    async function fetchWeather() {
        const loc = coords[$('weatherCitySelect').value] || coords.monaragala;
        $('weatherUpdateStatus').textContent = 'කාලගුණ දත්ත ලබා ගනිමින් පවතී...';
        try {
            const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=' + loc.lat + '&longitude=' + loc.lon +
                '&current=temperature_2m,relative_humidity_2m,precipitation');
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const data = await res.json();
            if (data && data.current) {
                $('tempVal').textContent = data.current.temperature_2m + ' °C';
                $('rainVal').textContent = data.current.precipitation + ' mm';
                $('humidityVal').textContent = data.current.relative_humidity_2m + ' %';
                $('rainIcon').textContent = data.current.precipitation > 0 ? '🌧️' : '☀️';
                $('weatherUpdateStatus').textContent = loc.name + ' සඳහා සජීවී කාලගුණ දත්ත ලබාගන්නා ලදී.';
            }
        } catch (e) {
            $('weatherUpdateStatus').textContent = 'කාලගුණ දත්ත ලබාගැනීමට අපොහොසත් විය. (අන්තර්ජාල සම්බන්ධතාව පරීක්ෂා කරන්න)';
        }
    }
</script>
