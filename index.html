<script>
(function () {
  // 1. Dashboard එකේ අගට කාලගුණ කොටස (Weather Widget Panel) එකතු කිරීම
  const container = document.querySelector('.container') || document.body;
  
  const weatherPanel = document.createElement('section');
  weatherPanel.className = 'panel';
  weatherPanel.style.gridColumn = 'span 12';
  weatherPanel.style.marginTop = '20px';
  weatherPanel.innerHTML = `
    <div class="panel-header">
      <h2><span>🌦️</span> <span id="weatherTitle">වගා බිමේ කාලගුණ තත්ත්වය (Weather & Temperature)</span></h2>
      <span class="badge-tag" id="weatherLocationTag">ශ්‍රී ලංකා</span>
    </div>
    <div style="padding: 15px;">
      <div style="display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; align-items: center;">
        <label for="weatherCitySelect" style="font-weight: 600; font-size: 0.9rem;">ප්‍රදේශය තෝරන්න:</label>
        <select id="weatherCitySelect" style="padding: 8px 12px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 0.9rem; background: #fff; cursor: pointer;">
          <option value="colombo">කොළඹ (Colombo)</option>
          <option value="gampaha" selected>ගම්පහ (Gampaha)</option>
          <option value="kandy">මහනුවර (Kandy)</option>
          <option value="kurunegala">කුරුණෑගල (Kurunegala)</option>
          <option value="anuradhapura">අනුරාධපුරය (Anuradhapura)</option>
          <option value="galle">ගාල්ල (Galle)</option>
          <option value="jaffna">යාපනය (Jaffna)</option>
        </select>
        <button id="refreshWeatherBtn" style="background: #2e7d32; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; font-weight: bold;">කාලගුණය යාවත්කාලීන කරන්න</button>
      </div>

      <!-- කාලගුණ දත්ත පෙන්වන පෙට්ටිය -->
      <div id="weatherInfoBox" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
        <div style="background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0; text-align: center;">
          <div style="font-size: 2rem; margin-bottom: 5px;" id="weatherIcon">🌡️</div>
          <div style="font-size: 0.85rem; color: #64748b;">වත්මන් උෂ්ණත්වය</div>
          <div style="font-size: 1.4rem; font-weight: bold; color: #1e293b;" id="tempVal">-- °C</div>
        </div>
        <div style="background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0; text-align: center;">
          <div style="font-size: 2rem; margin-bottom: 5px;" id="rainIcon">🌧️</div>
          <div style="font-size: 0.85rem; color: #64748b;">වර්ෂාපතන තත්ත්වය (Rain)</div>
          <div style="font-size: 1.4rem; font-weight: bold; color: #1e293b;" id="rainVal">-- mm</div>
        </div>
        <div style="background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0; text-align: center;">
          <div style="font-size: 2rem; margin-bottom: 5px;">💧</div>
          <div style="font-size: 0.85rem; color: #64748b;">ආර්ද්‍රතාවය (Humidity)</div>
          <div style="font-size: 1.4rem; font-weight: bold; color: #1e293b;" id="humidityVal">-- %</div>
        </div>
      </div>
      <div style="font-size: 0.78rem; color: #94a3b8; text-align: right; margin-top: 8px;" id="weatherUpdateStatus">දත්ත ලබාගනිමින් පවතී...</div>
    </div>
  `;
  container.appendChild(weatherPanel);

  // 2. ප්‍රදේශවල අක්ෂාංශ සහ සංඛ්‍යාංශ (Coordinates)
  const coords = {
    colombo: { lat: 6.9271, lon: 79.8612, name: 'කොළඹ (Colombo)' },
    gampaha: { lat: 7.0840, lon: 80.0098, name: 'ගම්පහ (Gampaha)' },
    kandy: { lat: 7.2906, lon: 80.6337, name: 'මහනුවර (Kandy)' },
    kurunegala: { lat: 7.4863, lon: 80.3647, name: 'කුරුණෑගල (Kurunegala)' },
    anuradhapura: { lat: 8.3114, lon: 80.4037, name: 'අනුරාධපුරය (Anuradhapura)' },
    galle: { lat: 6.0535, lon: 80.2210, name: 'ගාල්ල (Galle)' },
    jaffna: { lat: 9.6615, lon: 80.0255, name: 'යාපනය (Jaffna)' }
  };

  // 3. API එක හරහා කාලගුණ දත්ත ලබා ගැනීම
  async function fetchWeather() {
    const select = document.getElementById('weatherCitySelect');
    const cityKey = select ? select.value : 'gampaha';
    const loc = coords[cityKey] || coords['gampaha'];

    document.getElementById('weatherUpdateStatus').textContent = 'කාලගුණ දත්ත යාවත්කාලීන වෙමින් පවතී...';

    try {
      const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&current=temperature_2m,relative_humidity_2m,precipitation`);
      const data = await response.json();

      if (data && data.current) {
        const temp = data.current.temperature_2m;
        const humidity = data.current.relative_humidity_2m;
        const rain = data.current.precipitation;

        document.getElementById('tempVal').textContent = temp + ' °C';
        document.getElementById('rainVal').textContent = rain + ' mm';
        document.getElementById('humidityVal').textContent = humidity + ' %';
        
        // වැසි තත්ත්වය අනුව අයිකන් වෙනස් කිරීම
        const rainIcon = document.getElementById('rainIcon');
        if (rain > 0) {
          rainIcon.textContent = '🌧️';
          document.getElementById('rainVal').style.color = '#0284c7';
        } else {
          rainIcon.textContent = '☀️';
          document.getElementById('rainVal').style.color = '#d97706';
        }

        document.getElementById('weatherUpdateStatus').textContent = `${loc.name} ප්‍රදේශය සඳහා යාවත්කාලීන කරන ලදී.`;
      }
    } catch (error) {
      console.error('Weather fetch error:', error);
      document.getElementById('weatherUpdateStatus').textContent = 'කාලගුණ දත්ත ලබාගැනීමේ දෝෂයක් ඇති විය.';
    }
  }

  // Event Listeners සම්බන්ධ කිරීම
  const btn = document.getElementById('refreshWeatherBtn');
  if (btn) btn.addEventListener('click', fetchWeather);

  const sel = document.getElementById('weatherCitySelect');
  if (sel) sel.addEventListener('change', fetchWeather);

  // මුලින්ම Load වන විට Run කිරීම
  setTimeout(fetchWeather, 800);
})();
</script>
