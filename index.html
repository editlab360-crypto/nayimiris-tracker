<script>
let harvestChart = null;
let farmData = {
    plantingDate: '', lastFertilizer: '', lastFungicide: '', lastHormone: '',
    prodNpk: '', prodFungicide: '', prodHormone: '',
    lastWaterDate: '', lastWaterTime: '',
    weatherCity: 'monaragala',
    harvests: []
};
const CYCLE = { npk: 14, fungicide: 7, hormone: 10 };

const coords = {
    monaragala:   { lat: 6.8728, lon: 81.3507, name: 'මොනරාගල (Monaragala)' },
    colombo:      { lat: 6.9271, lon: 79.8612, name: 'කොළඹ (Colombo)' },
    gampaha:      { lat: 7.0840, lon: 80.0098, name: 'ගම්පහ (Gampaha)' },
    kandy:        { lat: 7.2906, lon: 80.6337, name: 'මහනුවර (Kandy)' },
    kurunegala:   { lat: 7.4863, lon: 80.3647, name: 'කුරුණෑගල (Kurunegala)' },
    anuradhapura: { lat: 8.3114, lon: 80.4037, name: 'අනුරාධපුරය (Anuradhapura)' },
    galle:        { lat: 6.0535, lon: 80.2210, name: 'ගාල්ල (Galle)' },
    jaffna:       { lat: 9.6615, lon: 80.0255, name: 'යාපනය (Jaffna)' }
};

const $ = id => document.getElementById(id);
const val = id => { const el = $(id); return el ? el.value : ''; };
const setText = (id, t) => { const el = $(id); if (el) el.textContent = t; };
const setHTML = (id, h) => { const el = $(id); if (el) el.innerHTML = h; };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => 'රු. ' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

function todayStr() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function daysSince(s) {
    if (!s) return null;
    const [y, m, d] = s.split('-').map(Number);
    const t = new Date(); t.setHours(0, 0, 0, 0);
    return Math.round((t - new Date(y, m - 1, d)) / 86400000);
}

document.addEventListener('DOMContentLoaded', () => {
    const sel = $('weatherCitySelect');
    if (sel) {
        sel.innerHTML = Object.keys(coords).map(k => '<option value="' + k + '">' + coords[k].name + '</option>').join('');
        sel.value = 'monaragala';
        sel.addEventListener('change', () => { saveData(); fetchWeather(); });
    }
    const lbl = document.querySelector('label[for="weatherCitySelect"]');
    if (lbl) lbl.textContent = 'වගා ස්ථානය තෝරන්න:';

    // දිනයන් සහ නම් වෙනස් වන විටම යාවත්කාලීන කිරීම
    ['plantingDate', 'lastFertilizer', 'lastFungicide', 'lastHormone'].forEach(id => {
        if ($(id)) $(id).addEventListener('change', updateAll);
    });
    ['prod_npk', 'prod_fungicide', 'prod_hormone'].forEach(id => {
        if ($(id)) $(id).addEventListener('input', updateAll);
    });

    if ($('harvestDate')) $('harvestDate').value = todayStr();
    if ($('manualWaterDate')) $('manualWaterDate').value = todayStr();

    loadData();
    updateAll();
    renderHarvests();
    fetchWeather();
});

function saveData() {
    farmData.plantingDate    = val('plantingDate');
    farmData.lastFertilizer  = val('lastFertilizer');
    farmData.lastFungicide   = val('lastFungicide');
    farmData.lastHormone     = val('lastHormone');
    farmData.prodNpk         = val('prod_npk');
    farmData.prodFungicide   = val('prod_fungicide');
    farmData.prodHormone     = val('prod_hormone');
    farmData.weatherCity     = val('weatherCitySelect') || farmData.weatherCity;
    try { localStorage.setItem('naiMirisFarmData', JSON.stringify(farmData)); } catch (e) { console.warn('Storage unavailable', e); }
}

function loadData() {
    try {
        const saved = localStorage.getItem('naiMirisFarmData');
        if (saved) farmData = Object.assign(farmData, JSON.parse(saved));
    } catch (e) { console.warn(e); }
    if (!Array.isArray(farmData.harvests)) farmData.harvests = [];
    if (!coords[farmData.weatherCity]) farmData.weatherCity = 'monaragala';

    const set = (id, v) => { if ($(id)) $(id).value = v || ''; };
    set('plantingDate', farmData.plantingDate);
    set('lastFertilizer', farmData.lastFertilizer);
    set('lastFungicide', farmData.lastFungicide);
    set('lastHormone', farmData.lastHormone);
    set('prod_npk', farmData.prodNpk);
    set('prod_fungicide', farmData.prodFungicide);
    set('prod_hormone', farmData.prodHormone);
    set('weatherCitySelect', farmData.weatherCity);
}

function recordWatering(timeSlot) {
    farmData.lastWaterDate = todayStr();
    farmData.lastWaterTime = timeSlot;
    updateAll();
}

function recordManualWatering() {
    const wDate = val('manualWaterDate');
    const wTime = val('manualWaterTime') || 'උදේ';
    if (!wDate) { alert('කරුණාකර දිනයක් තෝරන්න!'); return; }
    if (daysSince(wDate) < 0) { alert('අනාගත දිනයක් ඇතුළත් කළ නොහැක!'); return; }
    farmData.lastWaterDate = wDate;
    farmData.lastWaterTime = wTime;
    updateAll();
}

function reminderFor(name, days, cycle) {
    const rem = cycle - days;
    if (rem < 0)  return '<div class="reminder-box danger-reminder">🚨 <b>අවධානයයි:</b> ' + esc(name) + ' යෙදීම දවස් ' + (-rem) + 'ක් ප්‍රමාදයි! (චක්‍රය දින ' + cycle + ')</div>';
    if (rem === 0) return '<div class="reminder-box danger-reminder">🚨 <b>අද යෙදිය යුතුයි:</b> ' + esc(name) + ' (දින ' + cycle + 'ක චක්‍රය සම්පූර්ණයි)</div>';
    if (rem === 1) return '<div class="reminder-box">⚠️ <b>හෙට යෙදිය යුතුයි:</b> ' + esc(name) + '</div>';
    if (rem === 2) return '<div class="reminder-box">⚠️ <b>මතක් කිරීමයි:</b> ' + esc(name) + ' යෙදීමට තව දවස් 2යි.</div>';
    return '';
}

function updateAll() {
    saveData();

    // 1. වතුර තත්ත්වය
    let reminders = '';
    const wEl = $('lastWaterStatus');
    if (wEl) {
        if (farmData.lastWaterDate) {
            const wDays = daysSince(farmData.lastWaterDate);
            const timeText = farmData.lastWaterTime ? ' (' + esc(farmData.lastWaterTime) + ')' : '';
            if (wDays < 0) {
                wEl.textContent = 'දිනය වැරදියි (අනාගත දිනයක්)';
                wEl.style.color = '#ef4444';
            } else if (wDays === 0) {
                wEl.innerHTML = 'අද දිනයේදී' + timeText;
                wEl.style.color = '#0284c7';
            } else if (wDays === 1) {
                wEl.innerHTML = 'ඊයේ දිනයේදී' + timeText;
                wEl.style.color = '#d97706';
            } else {
                wEl.innerHTML = 'දින ' + wDays + ' කට පෙර (' + esc(farmData.lastWaterDate) + ')' + timeText;
                wEl.style.color = '#ef4444';
                reminders += '<div class="reminder-box danger-reminder">🚨 <b>අවධානයයි:</b> වගාවට වතුර යොදා දින ' + wDays + ' ක් වී ඇත! වහාම වතුර යොදන්න.</div>';
            }
        } else {
            wEl.textContent = 'තවම ඇතුළත් කර නොමැත';
            wEl.style.color = '';
        }
    }

    // 2. වගාවට ගතවූ දවස්
    const pDays = daysSince(val('plantingDate'));
    setText('totalDays', pDays !== null ? Math.max(0, pDays) : 0);

    // 3. පොහොර / දිලීර නාශක / හෝමෝන
    let statusText = '';
    const items = [
        { date: val('lastFertilizer'), name: val('prod_npk').trim()       || 'NPK පොහොර', cycle: CYCLE.npk },
        { date: val('lastFungicide'),  name: val('prod_fungicide').trim() || 'දිලීර නාශක', cycle: CYCLE.fungicide },
        { date: val('lastHormone'),    name: val('prod_hormone').trim()   || 'හෝමෝන',     cycle: CYCLE.hormone }
    ];

    items.forEach(it => {
        const days = daysSince(it.date);
        if (days === null) return;
        if (days < 0) {
            statusText += '• <b>' + esc(it.name) + '</b>: දිනය අනාගතයේ ඇත, කරුණාකර පරීක්ෂා කරන්න.<br>';
            return;
        }
        statusText += '• <b>' + esc(it.name) + '</b> යොදා දැනට <b>' + days + '</b> දවස් වී ඇත. (චක්‍රය දින ' + it.cycle + ')<br>';
        reminders += reminderFor(it.name, days, it.cycle);
    });

    setHTML('actionStatus', statusText || 'දිනයන් සහ භාවිත කළ ද්‍රව්‍ය ඇතුළත් කරන්න.');
    setHTML('reminderContainer', reminders || 'සක්‍රීය මතක් කිරීම් නොමැත.');
}

function addHarvest() {
    const hDate = val('harvestDate');
    const hAmount = parseFloat(val('harvestAmount'));
    const hPrice = parseFloat(val('harvestPrice')) || 0;
    const hNotes = val('harvestNotes').trim();

    if (!hDate || isNaN(hAmount) || hAmount <= 0) {
        alert('කරුණාකර නිවැරදි දිනයක් සහ බරක් (kg) ඇතුළත් කරන්න!');
        return;
    }
    if (hPrice < 0) { alert('මිල සෘණ අගයක් විය නොහැක!'); return; }

    farmData.harvests.push({ id: Date.now().toString(), date: hDate, amount: hAmount, price: hPrice, notes: hNotes });
    saveData();
    renderHarvests();
    ['harvestAmount', 'harvestPrice', 'harvestNotes'].forEach(id => { if ($(id)) $(id).value = ''; });
}

function deleteHarvest(id) {
    if (!confirm('මෙම වාර්තාව මකා දැමීමට අවශ්‍යද?')) return;
    farmData.harvests = farmData.harvests.filter(item => item.id !== id);
    saveData();
    renderHarvests();
}

function renderHarvests() {
    const tbody = $('harvestTableBody');
    if (!tbody) return;
    let totalKg = 0, totalRev = 0, rows = '';
    const sorted = [...farmData.harvests].sort((a, b) => new Date(b.date) - new Date(a.date));

    sorted.forEach(item => {
        const amount = Number(item.amount), price = Number(item.price) || 0;
        const v = amount * price;
        totalKg += amount; totalRev += v;
        rows +=
            '<tr><td>' + esc(item.date) + '</td>' +
            '<td><b>' + amount.toFixed(2) + ' kg</b></td>' +
            '<td>' + (price ? money(price) : '-') + '</td>' +
            '<td style="color:#d97706;font-weight:bold;">' + (v ? money(v) : '-') + '</td>' +
            '<td>' + (esc(item.notes) || '-') + '</td>' +
            '<td style="text-align:right;"><button class="btn-delete" onclick="deleteHarvest(\'' + esc(item.id) + '\')">🗑</button></td></tr>';
    });
    tbody.innerHTML = rows || '<tr><td colspan="6" style="text-align:center;">වාර්තා නොමැත.</td></tr>';

    setText('totalHarvestKg', totalKg.toFixed(2));
    setText('totalRevenueRs', money(totalRev));
    updateAnalytics();
}

function updateAnalytics() {
    const H = farmData.harvests || [];
    const tbody = $('monthlySummaryBody');

    if (harvestChart) { harvestChart.destroy(); harvestChart = null; }
    if (!H.length) {
        if (tbody) tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">දත්ත නොමැත.</td></tr>';
        return;
    }
    const sorted = [...H].sort((a, b) => new Date(a.date) - new Date(b.date));

    const ctx = $('harvestTrendsChart');
    if (ctx && typeof Chart !== 'undefined') {
        harvestChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: sorted.map(i => i.date),
                datasets: [
                    { type: 'line', label: '1 kg මිල (රු.)', data: sorted.map(i => Number(i.price) || 0), borderColor: '#ef4444', borderWidth: 3, yAxisID: 'yPrice' },
                    { type: 'bar', label: 'අස්වැන්න (kg)', data: sorted.map(i => Number(i.amount)), backgroundColor: 'rgba(46, 125, 50, 0.75)', yAxisID: 'yWeight' }
                ]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                scales: {
                    yWeight: { type: 'linear', position: 'left', beginAtZero: true },
                    yPrice: { type: 'linear', position: 'right', beginAtZero: true, grid: { drawOnChartArea: false } }
                }
            }
        });
    }

    const monthly = {};
    sorted.forEach(item => {
        const m = item.date.substring(0, 7);
        if (!monthly[m]) monthly[m] = { count: 0, kg: 0, val: 0 };
        monthly[m].count++;
        monthly[m].kg += Number(item.amount);
        monthly[m].val += Number(item.amount) * (Number(item.price) || 0);
    });
    if (tbody) {
        tbody.innerHTML = Object.keys(monthly).sort().reverse().map(m => {
            const d = monthly[m];
            const avg = d.kg ? d.val / d.kg : 0;
            return '<tr><td><b>' + esc(m) + '</b></td><td>' + d.count + ' වාරයක්</td>' +
                '<td><b>' + d.kg.toFixed(2) + ' kg</b></td>' +
                '<td>' + (avg ? money(avg) : '-') + '</td>' +
                '<td style="text-align:right;font-weight:bold;color:#d97706;">' + (d.val ? money(d.val) : '-') + '</td></tr>';
        }).join('');
    }
}

async function fetchWeather() {
    const loc = coords[val('weatherCitySelect')] || coords.monaragala;
    setText('weatherUpdateStatus', 'කාලගුණ දත්ත ලබා ගනිමින් පවතී...');
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 10000);
    try {
        const res = await fetch(
            'https://api.open-meteo.com/v1/forecast?latitude=' + loc.lat + '&longitude=' + loc.lon +
            '&current=temperature_2m,relative_humidity_2m,precipitation&timezone=auto',
            { signal: ctrl.signal }
        );
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        if (!data || !data.current) throw new Error('No data');
        setText('tempVal', data.current.temperature_2m + ' °C');
        setText('rainVal', data.current.precipitation + ' mm');
        setText('humidityVal', data.current.relative_humidity_2m + ' %');
        setText('rainIcon', data.current.precipitation > 0 ? '🌧️' : '☀️');
        setText('weatherUpdateStatus', loc.name + ' සඳහා සජීවී කාලගුණ දත්ත ලබාගන්නා ලදී.');
    } catch (e) {
        ['tempVal', 'rainVal', 'humidityVal'].forEach(id => setText(id, '-'));
        setText('weatherUpdateStatus', 'කාලගුණ දත්ත ලබාගැනීමට අපොහොසත් විය. (අන්තර්ජාල සම්බන්ධතාව පරීක්ෂා කරන්න)');
    } finally {
        clearTimeout(timer);
    }
}
</script>
